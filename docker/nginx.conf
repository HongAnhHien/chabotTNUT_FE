server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không phải file tĩnh -> index.html (React Router)
    # index.html không cache để bản build mới hiện ngay
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Tài nguyên có hash trong tên -> cache 1 năm, trình duyệt không hỏi lại
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Model khuôn mặt + WASM (~30MB, chỉ tải ở trang điểm danh) -> cache 30 ngày
    location ~ ^/(models|mediapipe)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
